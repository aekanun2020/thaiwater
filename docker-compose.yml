services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
      - ./mssql:/workspace:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - ./mssql:/workspace:ro
    entrypoint: ["/bin/bash", "/workspace/init.sh"]
    restart: "no"

  mssql-mcp:
    build: ./mcp
    depends_on:
      mssql-init:
        condition: service_completed_successfully
    environment:
      MSSQL_HOST: mssql
      MSSQL_PORT: "1433"
      MSSQL_DATABASE: ${MSSQL_DATABASE:-ThaiWaterLab}
      MSSQL_USER: sa
      MSSQL_PASSWORD: ${MSSQL_SA_PASSWORD}
      MAX_RESULT_ROWS: "500"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  langflow:
    image: langflowai/langflow:1.11.0
    depends_on:
      mssql-mcp:
        condition: service_healthy
    environment:
      LANGFLOW_AUTO_LOGIN: "false"
      LANGFLOW_SUPERUSER: ${LANGFLOW_SUPERUSER:-admin}
      LANGFLOW_SUPERUSER_PASSWORD: ${LANGFLOW_SUPERUSER_PASSWORD}
      LANGFLOW_CONFIG_DIR: /app/langflow
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "7860:7860"
    volumes:
      - ./langflow-data:/app/langflow
      - ./rag:/workspace/rag:ro
      - ./prompts:/workspace/prompts:ro

volumes:
  mssql-data:
